name: CD

# CI 成功后才部署到生产服务器
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    # 仅当 CI 成功时执行
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---------- 构建前端 ----------
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      # ---------- 打包 ----------
      - name: Package
        run: |
          tar czf deploy.tar.gz backend/app frontend/dist

      # ---------- 上传到服务器并重启 ----------
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Upload package
        run: scp -i ~/.ssh/deploy_key deploy.tar.gz ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/deploy.tar.gz

      - name: Deploy & restart
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            set -e
            cd /opt/yicode
            # 部署前自动备份数据库
            mkdir -p backups/pre-deploy
            sqlite3 data/yicode.db ".backup backups/pre-deploy/pre-deploy-$(date +%F-%H%M%S).db" || cp data/yicode.db backups/pre-deploy/ || true
            tar xzf /tmp/deploy.tar.gz
            rm /tmp/deploy.tar.gz
            systemctl restart yicode-backend
            sleep 2
            systemctl is-active --quiet yicode-backend
          '

      - name: Health check
        run: |
          sleep 3
          curl -fsS http://${{ secrets.DEPLOY_HOST }}/api/v1/problems > /dev/null
